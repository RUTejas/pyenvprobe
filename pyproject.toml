[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyenvprobe"
version = "0.3.0"
description = "A lightweight, framework-agnostic Python project checkup and health analysis tool."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "pyenvprobe Maintainers", email = "maintainers@pyenvprobe.org" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tomli>=2.0.1; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/pyenvprobe/pyenvprobe"
Repository = "https://github.com/pyenvprobe/pyenvprobe"
"Bug Tracker" = "https://github.com/pyenvprobe/pyenvprobe/issues"

[project.optional-dependencies]
ai = ["openai>=1.0.0"]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.2.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
pyenvprobe = "pyenvprobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyenvprobe"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
